<style>
:root{--bg:#F8F6F1;--card:#FFFFFF;--ink:#1F1416;--muted:#665A5D;--fill:#800020;--line:#EBDFE1;--tint:#F6ECEE;--deep:#3A0A14;--pink:#E8C9CC;--good:#1F7A4D;--goodbg:#E1F2E8;
--fd:'Fraunces',Georgia,serif;--fb:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--fb);-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--fill);outline-offset:3px}
.app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar .brand{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--fill)}
.bar .back{margin-left:auto;background:none;border:0;color:var(--muted);font:600 15px var(--fb);cursor:pointer;padding:6px}
.prog{display:flex;gap:4px;margin:6px 0 18px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.prog i.on{background:var(--fill)}
.view{flex:1;display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease}@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}}
.k{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fill)}
h1,h2{font-family:var(--fd);font-weight:600;line-height:1.06;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,11vw,3.2rem);margin:8px 0 12px}
h2{font-size:clamp(1.8rem,8vw,2.3rem);margin:8px 0 10px}
.lead{color:var(--muted);font-size:18px;margin:0 0 20px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:15px 16px;font:600 17px/1.35 var(--fb);color:var(--ink);cursor:pointer}
.opt .l{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--fill);display:grid;place-items:center;font-weight:700}
.opt.pick{border-color:var(--fill);background:var(--tint)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{opacity:.55}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:999px;border:2px solid var(--fill);background:var(--fill);color:#fff;font:700 18px var(--fb);text-decoration:none;padding:0 18px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--fill)}
.btn.light{background:#fff;color:var(--deep);border-color:#fff}
.foot{margin-top:auto;padding-top:18px;display:grid;gap:10px}
.skip{background:none;border:0;color:var(--muted);font:600 15px var(--fb);text-decoration:underline;cursor:pointer;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px}
.stack{display:grid;gap:10px;margin-bottom:16px}
.stack .card b{display:block;color:var(--fill);font-size:18px}
.stack .card span{color:var(--muted);font-size:15.5px}
.reveal{background:var(--fill);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:16px}
.reveal .big{font:700 clamp(1.7rem,7.5vw,2.1rem)/1.15 var(--fd)}
.reveal .big u{text-decoration:none;color:var(--pink)}
.reveal p{margin:10px 0 0;color:#F6E4E7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--tint);border-radius:14px;padding:10px}
.stats b{display:block;font:700 22px var(--fd);color:var(--fill)}
.stats span{font-size:12.5px;color:var(--muted);line-height:1.25;display:block}
.steps{display:grid;gap:10px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;text-decoration:none;font-weight:600}
.step .n{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--fill);color:#fff;display:grid;place-items:center;font-weight:700}
.step small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.step .go{margin-left:auto;color:var(--fill);font-weight:700;font-size:20px}
.step.done{border-color:var(--good);background:var(--goodbg)}
.step.done .n{background:var(--good)}
.step.done .go{color:var(--good)}
.pbar{height:8px;border-radius:8px;background:var(--tint);overflow:hidden;margin:0 0 14px}
.pbar i{display:block;height:100%;background:var(--fill);transition:width .4s ease}
.pbar i.ok{background:var(--good)}
.idea{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 18px;margin-bottom:14px}
.idea .ic{font-size:40px;line-height:1}
.idea h3{font:700 23px/1.2 var(--fd);margin:10px 0 6px}
.idea p{margin:0;color:var(--muted)}
.react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.react button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 4px;font:700 15px var(--fb);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.react button span{font-size:26px;line-height:1}
.react button:active{transform:scale(.96)}
.cnt{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font:600 15.5px var(--fb);color:var(--ink);cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.q{font:700 18px var(--fb);margin:6px 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font:700 15.5px var(--fb);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
input[type=text],input[type=tel],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px;font:400 16px var(--fb);color:var(--ink);margin-bottom:10px}
textarea{min-height:96px;resize:vertical}
.amb{background:var(--deep);color:#fff;border-radius:22px;padding:18px}
.amb h3{font:700 22px var(--fd);margin:0 0 6px}
.amb p{margin:0 0 12px;color:#EBD5D9;font-size:15.5px}
.amb input{background:#fff}
.stars{display:flex;gap:8px;margin-bottom:18px}
.stars button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 0;font:700 22px var(--fb);color:var(--muted);cursor:pointer}
.stars button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.stars-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:-12px 0 18px}
.intro{background:var(--deep);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:14px}
.intro .kk{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.intro h3{font:600 26px var(--fd);margin:6px 0 6px}
.intro p{margin:0 0 14px;color:#EBD5D9}
.ok{background:var(--goodbg);color:var(--good);border-radius:14px;padding:12px 14px;font-weight:700;text-align:center;margin-bottom:14px}
.explore{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.explore a{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-decoration:none}
.explore b{display:block;color:var(--fill)}
.explore span{font-size:13.5px;color:var(--muted)}
/* live board */
body.live{background:var(--fill);color:#fff;overflow:hidden}
.lv{min-height:100vh;padding:3.2vh 3.5vw;display:grid;grid-template-columns:1.35fr 1fr;gap:3.5vw;align-items:center}
.lv .eb{font-size:1.3vw;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.lv h1{font-size:4.4vw;color:#fff;margin:.6vh 0 2vh}
.lv h4{margin:2.2vh 0 1vh;font-size:1.35vw;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.lr{display:grid;grid-template-columns:27vw 1fr 4vw;gap:1vw;align-items:center;font-size:1.45vw;margin:.7vh 0}
.lr s{display:block;height:1.4vh;border-radius:1vh;background:rgba(255,255,255,.18);overflow:hidden;text-decoration:none}
.lr s u{display:block;height:100%;background:#fff;transition:width 1s ease}
.lr em{font-style:normal;font-weight:700;text-align:right}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;margin-top:1vh}
.kp div{background:rgba(255,255,255,.1);border-radius:1.2vw;padding:1.4vh 1.2vw}
.kp b{display:block;font:700 3vw var(--fd)}
.kp span{font-size:1.15vw;color:var(--pink)}
.qs{display:flex;flex-direction:column;align-items:center;gap:1.6vh;text-align:center}
.qs .qr{background:#fff;border-radius:2vw;padding:1.8vw}
.qs img{width:25vw;height:25vw;display:block;image-rendering:pixelated}
.qs .u{font-size:2.1vw;font-weight:700}
.qs .t{font:600 1.9vw var(--fd);min-height:2.8vw}
.qs .s{font-size:1.4vw;color:var(--pink)}
</style>
</head>

 join:function(){var n=0;for(var k=0;k<4;k++)if(done[k])n++;
  return shell('<div class="k">Join in 4 taps</div><h2>Have you followed us?</h2><p class="lead">Tap each one. They turn green when done.</p><div class="pbar"><i class="'+(n===4?"ok":"")+'" style="width:'+(n/4*100)+'%"></i></div>'+
  '<div class="steps">'+LINKS.map(function(l,k){return '<a class="step'+(done[k]?" done":"")+'" data-k="'+k+'" href="'+l[0]+'" target="_blank" rel="noopener"><span class="n">'+(done[k]?"✓":k+1)+'</span><span>'+esc(l[1])+'<small>'+esc(l[2])+'</small></span><span class="go" aria-hidden="true">'+(done[k]?"✓":"›")+'</span></a>'}).join("")+'</div>'+
  '<div class="foot"><button type="button" class="btn" data-act="next">'+(n===4?"Done! Next":"Next: this year at REL")+'</button>'+(n<4?'<p style="margin:0;text-align:center;color:var(--muted);font-size:14px">'+n+' of 4 done. You can come back to this.</p>':'')+'</div>')},
 ideas:function(){var r=S.data.ideas,left=IDEAS.filter(function(x){return !r[x[0]]});
  if(!left.length){var fire=IDEAS.filter(function(x){return r[x[0]]==="fire"});return shell('<div class="k">This year at REL</div><h2>Thanks! Your votes are in.</h2><p class="lead">'+(fire.length?"You loved: "+fire.map(function(x){return x[2]}).join(", ")+".":"Noted. Tell us what you'd prefer at the end.")+'</p><div class="foot"><button type="button" class="btn" data-act="next">Next: pick your workshops</button><button type="button" class="skip" data-act="reideas">Change my votes</button></div>')}
  var x=left[0],idx=IDEAS.length-left.length+1;
  return shell('<div class="k">This year at REL · rate our ideas</div><div class="cnt">'+idx+' of '+IDEAS.length+'</div><div class="idea"><div class="ic">'+x[1]+'</div><h3>'+esc(x[2])+'</h3><p>'+esc(x[3])+'</p></div>'+
  '<div class="react"><button type="button" data-rate="fire"><span>🔥</span>Love it</button><button type="button" data-rate="ok"><span>👍</span>Maybe</button><button type="button" data-rate="skip"><span>👎</span>Not for me</button></div>')},
 workshops:function(){var w=S.data.workshops;return shell('<div class="k">Workshops</div><h2>Which workshops would you never miss?</h2><p class="lead">Pick up to 3.</p>'+
  '<div class="chips">'+WORK.map(function(x){return '<button type="button" class="chip" aria-pressed="'+(w.indexOf(x[0])>=0)+'" data-ws="'+x[0]+'">'+esc(x[1])+'</button>'}).join("")+'</div>'+
  '<input type="text" id="wsOther" maxlength="120" placeholder="Another topic you want? (optional)" value="'+esc(S.data.wsOther||"")+'">'+
  '<div class="foot"><button type="button" class="btn" data-act="wsnext">Next: ambassadors</button></div>')},
 amb:function(){var d=S.data,p=d.perks;return shell('<div class="k">Ambassadors</div><h2>Should we open REL ambassadors?</h2><p class="lead">Ambassadors represent REL in their class: they share our events, bring friends, and help organize.</p>'+
  '<div class="seg">'+[["yes","Yes"],["maybe","Maybe"],["no","No"]].map(function(o){return '<button type="button" aria-pressed="'+(d.ambOpen===o[0])+'" data-amb="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'+
  '<div class="q">What would make it worth it for you?</div><div class="chips">'+PERKS.map(function(x){return '<button type="button" class="chip" aria-pressed="'+(p.indexOf(x[0])>=0)+'" data-perk="'+x[0]+'">'+esc(x[1])+'</button>'}).join("")+'</div>'+
  '<div class="amb"><h3>Be one of our first 6 ambassadors?</h3><p>Only 6 spots this year. Leave your name and the board will contact you. No commitment yet.</p>'+
  '<input type="text" id="aName" maxlength="80" placeholder="Your name" autocomplete="name" value="'+esc(d.ambName||"")+'"><input type="text" id="aContact" maxlength="80" placeholder="WhatsApp number or Instagram" value="'+esc(d.ambContact||"")+'"><input type="text" id="aYear" maxlength="60" placeholder="Year and major (optional)" value="'+esc(d.ambYear||"")+'"></div>'+
  '<div class="foot"><button type="button" class="btn" data-act="ambnext">Next: your feedback</button></div>')},
 feedback:function(){var c=S.data.clarity;return shell('<div class="k">Last step</div><h2>How clear is REL to you now?</h2>'+
  '<div class="stars">'+[1,2,3,4,5].map(function(n){return '<button type="button" aria-pressed="'+(c===n)+'" data-clar="'+n+'">'+n+'</button>'}).join("")+'</div><div class="stars-l"><span>Still confused</span><span>Crystal clear</span></div>'+
  '<div class="q">One idea, wish or feedback for REL</div><textarea id="fb" maxlength="600" placeholder="Anything: an event you want, a speaker, what we should do better…">'+esc(S.data.feedback||"")+'</textarea>'+
  '<div class="foot"><button type="button" class="btn" data-act="finish">Finish the tour</button></div>')},
 done:function(){var n=0;for(var k=0;k<4;k++)if(done[k])n++;return shell('<div class="k">Tour complete</div><h1>You\'re in the loop.</h1>'+
  (S.data.ambName?'<div class="ok">Thanks '+esc(S.data.ambName.split(" ")[0])+'! The board will contact you about the ambassador program.</div>':'')+
  '<div class="intro"><div class="kk">Coming soon</div><h3>The REL intro session</h3><p>Meet the board, see the full plan for the year and find your place in REL. The date is announced first on WhatsApp.</p><a class="btn light" href="'+WA+'" target="_blank" rel="noopener" data-k="0">'+(done[0]?"Open the WhatsApp community":"Join WhatsApp to get the date")+'</a></div>'+
  (n<4?'<button type="button" class="btn ghost" data-act="tojoin" style="margin-bottom:14px">Finish joining ('+n+' of 4 done)</button>':'')+
  '<a class="btn" href="/type" style="margin-bottom:16px">Bonus: what\'s your REL type?</a>'+
  '<div class="explore"><a href="/#events"><b>Events</b><span>Calendar and what\'s next</span></a><a href="/#play"><b>Play</b><span>Daily puzzles and points</span></a><a href="/#startups"><b>Startups</b><span>Idea lab and daily question</span></a><a href="/#mobilite"><b>Study abroad</b><span>Partner universities</span></a></div>'+
  '<div class="foot"><button type="button" class="skip" data-act="restart">Start the tour again</button></div>',{noBack:true})}
};
function draw(){app.innerHTML=V[STEPS[S.step]]()}

document.addEventListener("click",function(e){var t=e.target.closest("[data-act],[data-knew],[data-guess],[data-rate],[data-ws],[data-perk],[data-amb],[data-clar],[data-k]");if(!t)return;var d=S.data;
 if(t.hasAttribute("data-k")){var k=t.getAttribute("data-k");done[k]=1;lss("rel-type-steps",done);if(STEPS[S.step]==="join"||STEPS[S.step]==="done")setTimeout(function(){draw();sync()},400);return}
 if(t.dataset.knew){d.knew=t.dataset.knew;persist();setTimeout(next,180);return}
 if(t.dataset.guess){if(d.guess)return;d.guess=t.dataset.guess;persist();draw();return}
 if(t.dataset.rate){var left=IDEAS.filter(function(x){return !d.ideas[x[0]]});if(!left.length)return;d.ideas[left[0][0]]=t.dataset.rate;persist();draw();if(IDEAS.every(function(x){return d.ideas[x[0]]}))sync();return}
 if(t.dataset.ws){var i=d.workshops.indexOf(t.dataset.ws);if(i>=0)d.workshops.splice(i,1);else{if(d.workshops.length>=3)d.workshops.shift();d.workshops.push(t.dataset.ws)}persist();
  document.querySelectorAll("[data-ws]").forEach(function(b){b.setAttribute("aria-pressed",d.workshops.indexOf(b.dataset.ws)>=0)});return}
 if(t.dataset.perk){var j=d.perks.indexOf(t.dataset.perk);if(j>=0)d.perks.splice(j,1);else d.perks.push(t.dataset.perk);t.setAttribute("aria-pressed",j<0);persist();return}
 if(t.dataset.amb){d.ambOpen=t.dataset.amb;persist();document.querySelectorAll("[data-amb]").forEach(function(b){b.setAttribute("aria-pressed",b===t)});return}
 if(t.dataset.clar){d.clarity=+t.dataset.clar;persist();document.querySelectorAll("[data-clar]").forEach(function(b){b.setAttribute("aria-pressed",b===t)});return}
 var a=t.dataset.act;
 if(a==="back"){go(S.step-1);return}
 if(a==="next"){next();return}
 if(a==="reideas"){d.ideas={};persist();draw();return}
 if(a==="wsnext"){d.wsOther=(document.getElementById("wsOther").value||"").trim();next();return}
 if(a==="ambnext"){d.ambName=(document.getElementById("aName").value||"").trim();d.ambContact=(document.getElementById("aContact").value||"").trim();d.ambYear=(document.getElementById("aYear").value||"").trim();
  if(d.ambName&&!d.ambContact){var c=document.getElementById("aContact");c.focus();c.placeholder="Add your WhatsApp or Instagram so we can reach you";return}next();return}
 if(a==="finish"){d.feedback=(document.getElementById("fb").value||"").trim();next();return}
 if(a==="tojoin"){go(STEPS.indexOf("join"));return}
 if(a==="restart"){S={sid:uuid(),step:0,data:{ideas:{},workshops:[],perks:[]}};persist();draw();return}
});

/* live big screen: relulfg.com/welcome#live */
function live(){document.body.className="live";
 var names={};IDEAS.forEach(function(x){names[x[0]]=x[1]+" "+x[2]});var wn={};WORK.forEach(function(x){wn[x[0]]=x[1]});
 app.outerHTML='<div class="lv"><div><div class="eb">REL club · live from the stand</div><h1>What students want from REL</h1>'+
  '<div class="kp"><div><b id="lt">0</b><span>students took the tour</span></div><div><b id="lk">0%</b><span>didn\'t know REL before today</span></div><div><b id="la">0</b><span>want to be ambassadors</span></div></div>'+
  '<h4>Most loved ideas 🔥</h4><div id="li"></div><h4>Top workshops</h4><div id="lw"></div></div>'+
  '<div class="qs"><div class="qr"><img alt="QR code to relulfg.com/welcome" src="'+QR+'"></div><div class="u">relulfg.com/welcome</div><div class="t" id="tk"></div><div class="s">2-minute tour · Intro session coming soon · @relulfg</div></div></div>';
 var tips=["Vote for this year's events","Bitcoin Pizza Day or networking night?","Only 6 ambassador spots","What should REL do this year?","Scan. Meet REL."],ti=0;
 function tick(){var e=document.getElementById("tk");if(e)e.textContent=tips[ti++%tips.length]}
 function row(label,v,max){return '<div class="lr"><span>'+esc(label)+'</span><s><u style="width:'+(max?v/max*100:0)+'%"></u></s><em>'+v+'</em></div>'}
 function pull(){rpc("rel_welcome_live").then(function(d){if(!d)return;
  document.getElementById("lt").textContent=d.total||0;var kn=d.knew||{},kt=(kn.yes||0)+(kn.heard||0)+(kn.no||0);document.getElementById("lk").textContent=kt?Math.round((kn.no||0)/kt*100)+"%":"0%";
  document.getElementById("la").textContent=d.amb_leads||0;
  var ids=Object.keys(d.ideas||{}).map(function(k){return[k,d.ideas[k].fire||0]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5),mi=Math.max.apply(null,[1].concat(ids.map(function(x){return x[1]})));
  document.getElementById("li").innerHTML=ids.length?ids.map(function(x){return row(names[x[0]]||x[0],x[1],mi)}).join(""):'<p style="color:var(--pink)">Waiting for the first votes…</p>';
  var ws=Object.keys(d.workshops||{}).map(function(k){return[k,d.workshops[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,3),mw=Math.max.apply(null,[1].concat(ws.map(function(x){return x[1]})));
  document.getElementById("lw").innerHTML=ws.length?ws.map(function(x){return row(wn[x[0]]||x[0],x[1],mw)}).join(""):'<p style="color:var(--pink)">Waiting for the first picks…</p>'}).catch(function(){})}
 tick();pull();setInterval(pull,8000);setInterval(tick,3500)}

if((location.hash||"")==="#live")live();else draw();
})();
</script>
</body>
